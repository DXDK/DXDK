<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A dark, fog-veiled castle on a distant hill under a night sky" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#07070a"/>
      <stop offset="32%" stop-color="#131b25"/>
      <stop offset="62%" stop-color="#212a34"/>
      <stop offset="82%" stop-color="#452720"/>
      <stop offset="94%" stop-color="#341c1c"/>
      <stop offset="100%" stop-color="#170f10"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9dcb8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e9dcb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="backHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161d26"/>
      <stop offset="100%" stop-color="#0f141b"/>
    </linearGradient>
    <linearGradient id="midHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2530"/>
      <stop offset="100%" stop-color="#12181f"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="wideBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1200" height="360" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e9dcb8">
    <circle cx="120" cy="46" r="1.1" opacity="0.6"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="80" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="40" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.25;0.8;0.25" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="95" r="0.8" opacity="0.4"><animate attributeName="opacity" values="0.15;0.55;0.15" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="110" r="1" opacity="0.55"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="5.6s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="55" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="35" r="1.1" opacity="0.6"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="90" r="0.8" opacity="0.4"><animate attributeName="opacity" values="0.15;0.5;0.15" dur="5.3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="140" r="0.8" opacity="0.35"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="6.2s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="60" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="1040" cy="72" r="70" fill="url(#moonGlow)"/>
  <circle cx="1040" cy="72" r="24" fill="#e9dcb8" opacity="0.92"/>
  <circle cx="1050" cy="65" r="24" fill="#171017" opacity="0.14"/>

  <!-- distant hills -->
  <path fill="url(#backHills)" d="M0,300 L70,250 140,275 220,215 300,255 380,225 460,265 540,235 620,270 700,230 780,260 860,225 940,255 1020,215 1100,250 1170,230 1200,245 1200,360 0,360 Z"/>

  <!-- drifting mist behind the ridge -->
  <g opacity="0.22" filter="url(#wideBlur)">
    <ellipse cx="260" cy="272" rx="260" ry="16" fill="#8a95a3">
      <animateTransform attributeName="transform" type="translate" values="-30 0;30 0;-30 0" dur="24s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="640" cy="280" rx="320" ry="18" fill="#8a95a3">
      <animateTransform attributeName="transform" type="translate" values="25 0;-25 0;25 0" dur="28s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1000" cy="268" rx="260" ry="15" fill="#8a95a3">
      <animateTransform attributeName="transform" type="translate" values="-20 0;20 0;-20 0" dur="21s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- mid hills / castle mound -->
  <path fill="url(#midHills)" d="M0,330 L90,290 190,310 300,255 400,215 470,205 560,205 640,203 720,208 800,220 900,260 1000,300 1100,320 1200,300 1200,360 0,360 Z"/>

  <!-- castle silhouette -->
  <g fill="#0a0908">
    <!-- curtain walls -->
    <rect x="470" y="196" width="60" height="24"/>
    <rect x="690" y="199" width="55" height="21"/>
    <!-- wall crenellations -->
    <g>
      <rect x="470" y="190" width="8" height="8"/>
      <rect x="486" y="190" width="8" height="8"/>
      <rect x="502" y="190" width="8" height="8"/>
      <rect x="518" y="190" width="8" height="8"/>
      <rect x="690" y="193" width="7" height="8"/>
      <rect x="705" y="193" width="7" height="8"/>
      <rect x="720" y="193" width="7" height="8"/>
      <rect x="735" y="193" width="7" height="8"/>
    </g>
    <!-- left tower -->
    <rect x="410" y="150" width="42" height="70"/>
    <polygon points="410,150 431,118 452,150"/>
    <g>
      <rect x="410" y="144" width="7" height="8"/>
      <rect x="424" y="144" width="7" height="8"/>
    </g>
    <!-- keep (central) -->
    <rect x="530" y="95" width="80" height="125"/>
    <g>
      <rect x="530" y="88" width="9" height="9"/>
      <rect x="548" y="88" width="9" height="9"/>
      <rect x="566" y="88" width="9" height="9"/>
      <rect x="584" y="88" width="9" height="9"/>
      <rect x="601" y="88" width="9" height="9"/>
    </g>
    <!-- right tower -->
    <rect x="640" y="135" width="46" height="85"/>
    <polygon points="640,135 663,100 686,135"/>
    <g>
      <rect x="640" y="129" width="8" height="8"/>
      <rect x="656" y="129" width="8" height="8"/>
      <rect x="672" y="129" width="8" height="8"/>
    </g>
  </g>

  <!-- torch light -->
  <g fill="#d9a84e">
    <rect x="565" y="130" width="4" height="8" opacity="0.9">
      <animate attributeName="opacity" values="0.55;1;0.6;0.95;0.5" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="565" y="165" width="4" height="8" opacity="0.85">
      <animate attributeName="opacity" values="0.5;0.9;0.55;1;0.6" dur="3.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="429" y="172" width="4" height="7" opacity="0.8">
      <animate attributeName="opacity" values="0.45;0.85;0.5;0.9;0.45" dur="2.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="659" y="158" width="4" height="7" opacity="0.85">
      <animate attributeName="opacity" values="0.5;1;0.55;0.9;0.5" dur="2.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ravens -->
  <g stroke="#0a0908" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M -14,0 Q -7,-8 0,0 Q 7,-8 14,0">
      <animate attributeName="d" values="M -14,0 Q -7,-8 0,0 Q 7,-8 14,0;M -14,0 Q -7,4 0,0 Q 7,4 14,0;M -14,0 Q -7,-8 0,0 Q 7,-8 14,0" dur="0.7s" repeatCount="indefinite"/>
      <animateMotion path="M -60,120 C 250,70 500,150 620,95 S 1000,60 1260,110" dur="30s" repeatCount="indefinite"/>
    </path>
    <path d="M -10,0 Q -5,-6 0,0 Q 5,-6 10,0" opacity="0.7">
      <animate attributeName="d" values="M -10,0 Q -5,-6 0,0 Q 5,-6 10,0;M -10,0 Q -5,3 0,0 Q 5,3 10,0;M -10,0 Q -5,-6 0,0 Q 5,-6 10,0" dur="0.55s" repeatCount="indefinite"/>
      <animateMotion path="M -80,150 C 150,180 420,130 640,170 S 980,200 1280,140" dur="34s" begin="-6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- foreground mist -->
  <g opacity="0.28" filter="url(#softBlur)">
    <ellipse cx="180" cy="320" rx="220" ry="14" fill="#3d4652">
      <animateTransform attributeName="transform" type="translate" values="25 0;-25 0;25 0" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="620" cy="326" rx="300" ry="16" fill="#3d4652">
      <animateTransform attributeName="transform" type="translate" values="-30 0;30 0;-30 0" dur="19s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1020" cy="318" rx="230" ry="14" fill="#3d4652">
      <animateTransform attributeName="transform" type="translate" values="20 0;-20 0;20 0" dur="15s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- foreground ridge -->
  <path fill="#0c0a09" d="M0,340 L120,320 260,335 400,315 560,332 720,318 880,336 1040,322 1200,334 1200,360 0,360 Z"/>
</svg>
